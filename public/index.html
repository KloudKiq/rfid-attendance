<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>حضور الموظفين RFID</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      color: #1e293b;
    }

    /* ── Header ── */
    .site-header {
      background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #1e3a5f;
    }
    .site-header .logo {
      width: 40px; height: 40px;
      background: #3b82f6;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .site-header h1 { color: #f1f5f9; font-size: 20px; font-weight: 600; }
    .site-header span { color: #64748b; font-size: 13px; margin-right: auto; }

    /* ── Layout ── */
    .main { max-width: 900px; margin: 0 auto; padding: 32px 20px; }

    /* ── Scan Hero ── */
    .scan-hero {
      background: linear-gradient(135deg, #1e3a5f 0%, #162032 100%);
      border-radius: 20px;
      padding: 48px 32px;
      text-align: center;
      margin-bottom: 24px;
      border: 1px solid #1e3a5f;
      position: relative;
      overflow: hidden;
    }
    .scan-hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(59,130,246,.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .rfid-icon {
      font-size: 64px;
      margin-bottom: 16px;
      display: block;
      filter: drop-shadow(0 0 20px rgba(59,130,246,.5));
    }
    .scan-hero h2 { color: #f1f5f9; font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .scan-hero .sub { color: #94a3b8; font-size: 15px; margin-bottom: 28px; }

    .scan-input-wrap {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 400px;
    }
    #scanCard {
      width: 100%;
      padding: 16px 20px;
      font-size: 18px;
      border: 2px solid #22c55e;
      border-radius: 12px;
      background: rgba(34,197,94,.08);
      color: #f1f5f9;
      text-align: center;
      outline: none;
      transition: border-color .2s, background .2s, box-shadow .2s;
      caret-color: transparent;
    }
    #scanCard::placeholder { color: #475569; }
    #scanCard.scanning {
      border-color: #f59e0b;
      background: rgba(245,158,11,.08);
      box-shadow: 0 0 0 4px rgba(245,158,11,.2);
    }
    #scanCard:focus { box-shadow: 0 0 0 4px rgba(34,197,94,.25); }

    .pulse-dot {
      display: inline-block;
      width: 10px; height: 10px;
      background: #22c55e;
      border-radius: 50%;
      margin-left: 6px;
      animation: pulse 1.8s ease-in-out infinite;
      vertical-align: middle;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50% { opacity:.4; transform:scale(1.4); }
    }
    #scanReady { color: #86efac; font-size: 14px; margin-top: 14px; }

    /* ── Scan message ── */
    #scanMsg { margin-top: 20px; min-height: 56px; }
    .msg-ok, .msg-err {
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      animation: fadeIn .3s ease;
    }
    .msg-ok  { background: rgba(34,197,94,.15);  color: #86efac; border: 1px solid rgba(34,197,94,.3); }
    .msg-err { background: rgba(239,68,68,.15);  color: #fca5a5; border: 1px solid rgba(239,68,68,.3); }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }

    /* ── Card panel ── */
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
    }
    .card h3 {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h3 .icon { font-size: 18px; }

    /* ── Inputs ── */
    .field-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 160px; }
    .field label { font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: .5px; }
    .field input {
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      color: #1e293b;
      outline: none;
      transition: border-color .2s;
      width: 100%;
    }
    .field input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }

    /* ── Buttons ── */
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: filter .15s, transform .1s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(.97); }
    .btn:hover { filter: brightness(1.08); }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-success { background: #22c55e; color: #fff; }
    .btn-danger  { background: #ef4444; color: #fff; }
    .btn-ghost   { background: #f1f5f9; color: #475569; }

    /* ── Messages inline ── */
    .inline-msg { font-size: 13px; font-weight: 600; margin-top: 10px; }
    .ok  { color: #16a34a; }
    .err { color: #dc2626; }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th { background: #f8fafc; color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; padding: 10px 12px; border-bottom: 2px solid #e2e8f0; text-align: right; }
    td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; color: #334155; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge-in  { background: #dcfce7; color: #16a34a; }
    .badge-out { background: #fee2e2; color: #dc2626; }

    .hidden { display: none; }

    /* ── Admin section dark header ── */
    #adminBox .card h3 { color: #0f172a; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="logo">📋</div>
  <h1>نظام حضور الموظفين</h1>
  <span>RFID Attendance System</span>
</header>

<div class="main">

  <!-- Scan Hero -->
  <div class="scan-hero">
    <span class="rfid-icon">📡</span>
    <h2>تسجيل الحضور والخروج</h2>
    <p class="sub">مرر بطاقتك أمام القارئ في أي وقت</p>
    <div class="scan-input-wrap">
      <input id="scanCard" placeholder="في انتظار البطاقة..." autofocus autocomplete="off" readonly>
    </div>
    <div id="scanReady"><span class="pulse-dot"></span> جاهز للمسح</div>
    <div id="scanMsg"></div>
  </div>

  <div style="text-align:center;margin-top:8px">
    <a href="/admin.html" style="color:#475569;font-size:12px;text-decoration:none;opacity:.6">⚙️ لوحة الإدارة</a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

const ADMIN_INPUT_IDS = new Set([]);

let scanBuffer = "";
let scanTimer = null;

document.addEventListener("keydown", e => {
  const active = document.activeElement;
  if (active && ADMIN_INPUT_IDS.has(active.id)) return;

  if (e.key === "Enter") {
    const card = scanBuffer.trim();
    scanBuffer = "";
    clearTimeout(scanTimer);
    if (card) {
      $("scanCard").value = card;
      check();
    }
    e.preventDefault();
    return;
  }

  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    $("scanCard").classList.add("scanning");
    scanBuffer += e.key;
    $("scanCard").value = scanBuffer;
    clearTimeout(scanTimer);
    scanTimer = setTimeout(() => {
      scanBuffer = "";
      $("scanCard").value = "";
      $("scanCard").classList.remove("scanning");
    }, 500);
    e.preventDefault();
  }
});

document.addEventListener("click", e => {
  if (!ADMIN_INPUT_IDS.has(e.target?.id) && e.target?.tagName !== "BUTTON") {
    $("scanCard").focus();
  }
});

async function api(url, data) {
  const res = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data || {})
  });
  const json = await res.json();
  if (!res.ok) throw json;
  return json;
}

async function check() {
  const card = $("scanCard").value.trim();
  $("scanCard").value = "";
  $("scanCard").classList.remove("scanning");
  scanBuffer = "";
  try {
    const r = await api("/api/check", { card_id: card });
    const typeLabel = r.type === "IN" ? "✅ دخول" : "🚪 خروج";
    $("scanMsg").innerHTML =
      `<div class="msg-ok">${typeLabel} — ${r.employee.name} — ${r.time}</div>`;
  } catch (e) {
    $("scanMsg").innerHTML =
      `<div class="msg-err">⚠️ ${e.error || "خطأ"}${e.card_id ? " — البطاقة: " + e.card_id : ""}</div>`;
  }
  setTimeout(() => { $("scanMsg").innerHTML = ""; }, 5000);
}

</script>
</body>
</html>
